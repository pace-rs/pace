[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
authors = ["the pace-rs team"]
categories = ["command-line-utilities"]
edition = "2024"
homepage = "https://pace.cli.rs"
keywords = ["cli", "time-tracking", "productivity"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/pace-rs/pace"
rust-version = "1.98"

[workspace.dependencies]
abscissa_core = { version = "0.9.0", default-features = false }
abscissa_tokio = "0.9.0"
clap = "4.6.10"
clap_complete = "4.6.12"
clap_complete_nushell = "4.6.3"
dialoguer = { version = "0.12.0", default-features = false }
directories = "6.0.0"
gethostname = "1.1.0"
insta = { version = "1.49.0", features = ["filters"] }
jiff = "1.0.3"
miette = { version = "7.6.0", default-features = false }
pace_core = { path = "crates/pace-core" }
pace_error = { path = "crates/pace-error" }
pace_store = { path = "crates/pace-store" }
pace_time = { path = "crates/pace-time" }
pollster = "1.0.3"
proptest = "1.12.0"
rstest = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.154"
shell-words = "1.1.1"
strsim = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.3"
uuid = "1.29.3"

[package]
name = "pace-rs"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "pace: a local-first command-line time tracker for work and daily life"

[[bin]]
name = "pace"
path = "src/bin/pace.rs"

[[bench]]
name = "latency"
harness = false

[dependencies]
abscissa_core = { workspace = true, features = ["application"] }
abscissa_tokio = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
dialoguer = { workspace = true }
directories = { workspace = true }
jiff = { workspace = true }
miette = { workspace = true, features = ["fancy-no-backtrace"] }
pace_core = { workspace = true }
pace_error = { workspace = true }
pace_store = { workspace = true }
pace_time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shell-words = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
insta = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_results = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"
enum_glob_use = "warn"
# PaceError guidance has {placeholders} that are filled from the attached
# context (the rustic_core error design), not format arguments.
literal_string_with_formatting_args = "allow"
