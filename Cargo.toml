[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.16.0"
authors = ["the pace-rs team"]
categories = ["command-line-utilities"]
edition = "2024"
homepage = "https://pace.cli.rs"
keywords = ["cli", "time-tracking", "productivity"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/pace-rs/pace"
rust-version = "1.100"

[workspace.dependencies]
abscissa_core = { version = "0.9.0", default-features = false }
clap = "4.6.10"
clap_complete = "4.6.12"
clap_complete_nushell = "4.6.3"
dialoguer = { version = "0.12.0", default-features = false }
directories = "6.0.0"
gethostname = "1.1.0"
insta = { version = "1.49.0", features = ["filters"] }
iso_currency = { version = "0.7.1", features = ["iterator"] }
jiff = "1.0.3"
miette = { version = "7.6.0", default-features = false }
pace_core = { path = "crates/pace-core" }
pace_error = { path = "crates/pace-error" }
pace_store = { path = "crates/pace-store" }
pace_time = { path = "crates/pace-time" }
proptest = "1.12.0"
rstest = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.154"
shell-words = "1.1.1"
strsim = "0.11.1"
tempfile = "3.27.0"
tera = { version = "2.4.0", default-features = false }
terminal_size = "0.4.4"
toml = "1.2.3"
toml_edit = "0.25.21"
uuid = "1.29.3"

[package]
name = "pace-rs"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "pace: a local-first command-line time tracker for work and daily life"

# dist builds and ships pace-rs although Cargo's `publish = false` would skip
# it: pace publishes no crate, but ships binaries and installers.
[package.metadata.dist]
dist = true

# The Windows installer keeps the old pace's GUIDs, so the msi of 0.16.0
# upgrades an installed 0.15.2 instead of installing beside it.
[package.metadata.wix]
upgrade-guid = "4D6D5C4F-3994-423F-9D4C-2F92C580F54B"
path-guid = "441ECBBB-93E2-4DC2-9D74-F4B116EDFABE"
license = false
eula = false

# cargo-binstall downloads the archives that dist uploads to the GitHub
# release, tagged `pace-rs-v{version}`:
# https://github.com/cargo-bins/cargo-binstall/blob/HEAD/SUPPORT.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

# dist packs the Windows zip flat, without the folder `{ name }-{ target }/`
# that its tarballs have (dist 0.34.0, `make_executable_zip_for_variant`).
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "pace"
path = "src/bin/pace.rs"

[[bench]]
name = "latency"
harness = false

[dependencies]
abscissa_core = { workspace = true, features = ["application"] }
clap = { workspace = true, features = ["derive", "wrap_help"] }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
dialoguer = { workspace = true }
directories = { workspace = true }
gethostname = { workspace = true }
jiff = { workspace = true }
miette = { workspace = true, features = ["fancy-no-backtrace"] }
pace_core = { workspace = true }
pace_error = { workspace = true }
pace_store = { workspace = true }
pace_time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shell-words = { workspace = true }
tempfile = { workspace = true }
tera = { workspace = true }
terminal_size = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
insta = { workspace = true }
pace_store = { workspace = true, features = ["testing"] }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_results = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"
enum_glob_use = "warn"
# PaceError guidance has {placeholders} that are filled from the attached
# context (the rustic_core error design), not format arguments.
literal_string_with_formatting_args = "allow"
# rustc's unreachable_pub wants pub(crate) for an item that no other crate
# reaches; this nursery lint calls pub(crate) in a private module redundant.
redundant_pub_crate = "allow"
