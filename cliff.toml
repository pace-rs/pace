# git-cliff writes CHANGELOG.md from the Conventional Commits:
# `git cliff --tag pace-rs-v0.16.0 --output CHANGELOG.md`.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to pace are in this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and pace follows
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). 0.16.0 is the first
release of the restarted pace; the releases up to 0.15.2 are the old pace.\n
"""
# A Tera template for each release
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="pace-rs-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Parse the commits as Conventional Commits and leave out the others
conventional_commits = true
filter_unconventional = true
split_commits = false
# The group of a commit; the HTML comment orders the groups
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^style", group = "<!-- 5 -->Style" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(build|ci|chore)", group = "<!-- 7 -->Build and CI" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
# A breaking change stays in the changelog, whatever its group
protect_breaking_commits = true
filter_commits = false
# The tags of pace's releases, such as `pace-rs-v0.16.0`
tag_pattern = "pace-rs-v[0-9].*"
topo_order = false
sort_commits = "oldest"
