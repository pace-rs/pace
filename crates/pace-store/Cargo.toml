[package]
name = "pace_store"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
description = "pace_store: the event store of pace, its port, driver and backends, devices and state files"

[dependencies]
gethostname = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
pace_core = { workspace = true }
pace_error = { workspace = true }
pace_time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strsim = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[features]
# `pace_store::testing`: a scratch directory, the in-memory store and the
# store contract. The contract runs on `pace_core`'s test clock.
testing = ["pace_core/testing"]

[dev-dependencies]
insta = { workspace = true }
miette = { workspace = true }
pace_store = { path = ".", features = ["testing"] }
proptest = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
