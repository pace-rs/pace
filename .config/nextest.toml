[profile.default]
status-level = "slow"
fail-fast = false

[profile.ci]
failure-output = "immediate-final"
fail-fast = false

# Tests in a module named `expensive` cost more than the others (each module's
# doc says why); codegate's slow-tests gate wants them bounded.
[test-groups]
expensive = { max-threads = 2 }

[[profile.default.overrides]]
filter = "test(/::expensive::/)"
test-group = "expensive"

# codegate's coverage run, whose durations the slow-tests gate reads. With a
# thread per core, 48 on the sandbox machine, the journey tests' spawns of the
# instrumented binary wait on each other and land at 0.5 s; with 8 the slowest
# takes 0.25 s.
[profile.codegate]
test-threads = 8
